name: Saver Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Dart build outputs
        uses: actions/cache@v3
        with:
          path: |
            .dart_tool
            build
          key: ${{ runner.os }}-dart-build-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-build-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install automation dependencies
        run: pip install -r scripts/requirements.txt

      - name: Decode and setup keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVER_UPLOAD_STORE_FILE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --dart-define=SAMPLE_DATA=false --dart-define=DEVELOPER_MODE=false

      - name: Build Android App Bundle (AAB) using automation script
        env:
          SAVER_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
          SAVER_UPLOAD_KEY_ALIAS: ${{ secrets.SAVER_UPLOAD_KEY_ALIAS }}
          SAVER_UPLOAD_STORE_PASSWORD: ${{ secrets.SAVER_UPLOAD_STORE_PASSWORD }}
          SAVER_UPLOAD_KEY_PASSWORD: ${{ secrets.SAVER_UPLOAD_KEY_PASSWORD }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          python3 scripts/build.py android $VERSION

      - name: Get app version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      # - name: Upload AAB artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: saver-${{ steps.version.outputs.version }}.aab
      #     path: build/app/outputs/bundle/release/app-release.aab
