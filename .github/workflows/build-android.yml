name: Saver Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVER_UPLOAD_STORE_FILE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --dart-define=SAMPLE_DATA=false --dart-define=DEVELOPER_MODE=false

      - name: Build Android App Bundle (AAB)
        env:
          SAVER_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/app/keystore.jks
          SAVER_UPLOAD_KEY_ALIAS: ${{ secrets.SAVER_UPLOAD_KEY_ALIAS }}
          SAVER_UPLOAD_STORE_PASSWORD: ${{ secrets.SAVER_UPLOAD_STORE_PASSWORD }}
          SAVER_UPLOAD_KEY_PASSWORD: ${{ secrets.SAVER_UPLOAD_KEY_PASSWORD }}
        run: flutter build appbundle --release --no-tree-shake-icons \
          --dart-define=SAMPLE_DATA=false \
          --dart-define=DEVELOPER_MODE=false

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
