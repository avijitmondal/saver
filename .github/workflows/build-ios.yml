name: Saver iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install automation dependencies
        run: pip install -r scripts/requirements.txt

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache Dart build outputs
        uses: actions/cache@v3
        with:
          path: |
            .dart_tool
            build
          key: ${{ runner.os }}-dart-build-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-build-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --dart-define=SAMPLE_DATA=false --dart-define=DEVELOPER_MODE=false

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS development build using automation script
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          python3 scripts/build.py ios $VERSION --dev

      - name: Get app version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      # - name: Upload IPA artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: saver-${{ steps.version.outputs.version }}-dev.ipa
      #     path: build/ios/Release-iphoneos/app-development.ipa
