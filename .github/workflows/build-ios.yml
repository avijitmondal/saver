name: Saver iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache Dart build outputs
        uses: actions/cache@v3
        with:
          path: |
            .dart_tool
            build
          key: ${{ runner.os }}-dart-build-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-build-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --dart-define=SAMPLE_DATA=false --dart-define=DEVELOPER_MODE=false

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS development build
        run: |
          flutter build ios --release --no-tree-shake-icons --no-codesign \
            --dart-define=SAMPLE_DATA=false \
            --dart-define=DEVELOPER_MODE=false

      - name: Create IPA from development build
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-development.ipa Payload
          cd ../../..

      - name: Get app version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      # - name: Upload IPA artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: saver-${{ steps.version.outputs.version }}-dev.ipa
      #     path: build/ios/Release-iphoneos/app-development.ipa
