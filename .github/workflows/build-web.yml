name: Saver Web Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Dart build outputs
        uses: actions/cache@v3
        with:
          path: |
            .dart_tool
            build
          key: ${{ runner.os }}-dart-build-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-build-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --dart-define=SAMPLE_DATA=false --dart-define=DEVELOPER_MODE=false

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --dart-define=SAMPLE_DATA=false \
            --dart-define=DEVELOPER_MODE=false

      - name: Get app version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saver-${{ steps.version.outputs.version }}
          path: build/web
